[package]
name = "meeting-copilot"
version = "0.3.0"
description = "A desktop meeting assistant using OpenAI Realtime or Gemini Live"
edition = "2021"
rust-version = "1.85"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "12.0.0", features = ["macos_15_0"] }
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
